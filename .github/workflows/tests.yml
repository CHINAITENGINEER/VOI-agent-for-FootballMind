name: Offline regression
on: [push, pull_request]
jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-replay.txt pytest==9.1.1
      - run: python -m pytest -q tests/foundation tests/demo/test_defense_api.py tests/demo/test_defense_budget.py tests/demo/test_live_candidate_time.py tests/demo/test_live_postread.py tests/demo/test_live_postread_model.py
      - run: python -m footballmind doctor --mode offline
      - run: python -m footballmind experiment run config/experiments/frozen-replay.example.json
      - run: python -m footballmind verify var/experiments/frozen-development-replay-v1/predictions.jsonl
